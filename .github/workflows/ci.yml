---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (saves runner minutes). Pushes to
# main are never cancelled mid-flight; only PR iterations supersede each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          npm install --global markdownlint-cli2 markdown-link-check
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Check required repository files
        run: bash scripts/check_repo_completeness.sh

      - name: Check release version consistency
        run: bash scripts/check_release_versions.sh

      - name: Check public support and approval claims
        run: bash tests/release/public-claims.test.sh

      - name: Test setup package contracts
        run: npm test --prefix packages/setup

      - name: Check MCP Registry manifest coherence
        run: bash tests/release/registry-manifest.test.sh

      - name: Check Smithery manifest coherence
        run: bash tests/release/smithery-manifest.test.sh

      - name: Check Codex plugin manifest metadata
        run: bash tests/release/codex-plugin-manifest.test.sh

      - name: Check release rehearsal contract
        run: bash tests/release/release-rehearsal.test.sh

      - name: Check mount-edit refuses symlinked mountpoints
        run: bash tests/release/mount-edit.test.sh

      - name: Check a replay reproduces the run that recorded it
        run: bash tests/release/cassette-replay-parity.test.sh

      - name: Check the secret scanner catches keys and ignores fixtures
        run: bash tests/release/no-secrets.test.sh

      - name: Check systemd directory modes match tmpfiles
        run: bash tests/release/systemd-directory-modes.test.sh

      - name: Check rmswap only removes known swap files
        run: bash tests/release/rmswap.test.sh

      - name: Check log-edit confines rotation to the log root
        run: bash tests/release/log-edit.test.sh

      - name: Check grub-kargs-edit screens karg deletions
        run: bash tests/release/grub-kargs-edit.test.sh

      - name: Check provider parity across E2E entry points
        run: bash tests/e2e/provider-parity.test.sh

      - name: Check story metadata is derived from the story files
        run: bash tests/e2e/story-metadata.test.sh

      - name: Check Ubuntu VM bootstrap contract
        run: bash tests/e2e/ubuntu-vm-bootstrap.test.sh

      - name: Lint markdown
        run: |
          markdownlint-cli2 \
            README.md \
            CONTRIBUTING.md \
            SECURITY.md \
            CODE_OF_CONDUCT.md \
            ROADMAP.md \
            docs/architecture.md \
            docs/developer-guide.md \
            docs/adr/*.md

      - name: Check markdown links
        run: |
          for file in \
            README.md \
            CONTRIBUTING.md \
            SECURITY.md \
            CODE_OF_CONDUCT.md \
            ROADMAP.md \
            docs/architecture.md \
            docs/developer-guide.md \
            docs/adr/0001-system-boundaries.md \
            docs/adr/0002-brain-provider-layer.md \
            docs/adr/0003-ipc-wire-protocol.md
          do
            # Retry on transient network failure. `retryOn429` in the config only
            # covers rate limiting, and the failures actually seen here were
            # Status 0 — a connection/DNS blip on the runner against hosts that
            # were serving 200 at the time. Twice in one day, each costing a
            # full CI round-trip on an unrelated PR.
            #
            # This does not weaken the check: a genuinely dead link fails all
            # three attempts. It only stops one dropped packet from failing a
            # build.
            for attempt in 1 2 3; do
              if markdown-link-check --config .markdown-link-check.json "$file"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::dead link(s) in $file after 3 attempts"
                exit 1
              fi
              echo "link check for $file failed (attempt $attempt/3); retrying in 10s"
              sleep 10
            done
          done

      - name: Lint GitHub issue templates
        run: yamllint .github/ISSUE_TEMPLATE/*.yml .github/workflows/*.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sysknife-shell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Test
        # Wrapper around the same vitest command; it also fails when the
        # published frontend test count no longer matches the suite.
        working-directory: ${{ github.workspace }}
        run: scripts/test_baseline.sh --frontend

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # --all-targets so #[cfg(test)] code is linted too. Without it a
        # duplicated #[test] attribute (which silently drops the test it was
        # meant for) and dead test helpers both pass CI: rustc emits warnings
        # that this job never compiles.
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Doc check (broken intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2
        with:
          tool: cargo-nextest

      - name: Test workspace
        # Wrapper around the same nextest command; it also fails when the
        # published test count in tests/evidence/workspace-tests.json no longer
        # matches the suite, because the docs derive their figure from it.
        run: scripts/test_baseline.sh

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sysknife
          POSTGRES_PASSWORD: sysknife
          POSTGRES_DB: sysknife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sysknife -d sysknife_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYSKNIFE_TEST_POSTGRES_URL: >-
        postgres://sysknife:sysknife@127.0.0.1:5432/sysknife_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Run live Postgres migration and store contract
        run: cargo test -p sysknife-daemon --test postgres_store --locked

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2
        with:
          tool: cargo-audit

      - name: Audit dependencies for known RustSec advisories
        # Fails the build on any unignored vulnerability. Unmaintained-crate
        # warnings are reported but non-fatal (default cargo-audit behaviour).
        #
        # No advisory is ignored. The RUSTSEC-2026-0097 (rand 0.7.3) ignore was
        # dropped once the dependency itself left the lockfile: an `--ignore` for
        # a crate that is no longer built does not protect anything, it only
        # arms a silent re-acceptance if a future bump drags the crate back in.
        #
        # The accepted unmaintained/unsound advisories (all GUI-transitive) are
        # catalogued in docs/security/audit-advisories.md; those are warnings,
        # which cargo-audit reports without failing.
        run: cargo audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Review dependency changes
        # dependency-review requires GitHub Advanced Security + the dependency
        # graph, which are free on public repositories but a paid add-on on
        # private ones. The repo is private during the launch hold and goes
        # public at release, so gate the review on visibility: the step no-ops
        # (job stays green) while private and runs for real once public. The
        # job itself always runs, so this required check always reports a status.
        if: github.event.repository.visibility == 'public'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
        with:
          fail-on-severity: high
