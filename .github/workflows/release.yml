---
# Release workflow for SysKnife.
#
# Triggered by pushing a version tag (v*.*.*).
# Builds sysknife and sysknife-daemon for Linux x86_64 and aarch64,
# then creates a GitHub release with the binaries as assets.
#
# Binary naming convention:
#   sysknife-v0.1.0-linux-x86_64
#   sysknife-daemon-v0.1.0-linux-x86_64
#   sysknife-v0.1.0-linux-aarch64
#   sysknife-daemon-v0.1.0-linux-aarch64

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Group per tag so distinct release tags never cancel each other, and never
# cancel a release mid-flight (a half-uploaded release leaves a broken tag).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Validate tag and package versions
        run: bash scripts/check_release_versions.sh "${{ github.ref_name }}"

      - name: Check registry state for resumable publishing
        run: bash scripts/check_registry_versions.sh "${{ github.ref_name }}"

      # The MCP Registry listing is published from server.json against the crate
      # this release uploads, so an incoherent manifest is a release-time defect.
      - name: Check MCP Registry manifest coherence
        run: bash tests/release/registry-manifest.test.sh

      - name: Require publication credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "${CARGO_REGISTRY_TOKEN:-}" || { echo '::error::CARGO_REGISTRY_TOKEN is not configured'; exit 1; }

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Sigstore signing: the attest steps swap this job's OIDC token for a
      # short-lived signing certificate. Besides publish-npm and
      # publish-registry (their own registries), no other job may request one.
      id-token: write
      # Persist the provenance and SBOM attestations on the repository. Held by
      # this job alone; the release job only uploads files and cannot sign.
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable (branch)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build --release --locked \
            -p sysknife-cli \
            -p sysknife-daemon

      - name: Rename and stage binaries
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          cp target/release/sysknife        "sysknife-${VERSION}-linux-${ARCH}"
          cp target/release/sysknife-daemon "sysknife-daemon-${VERSION}-linux-${ARCH}"
          chmod +x "sysknife-${VERSION}-linux-${ARCH}"
          chmod +x "sysknife-daemon-${VERSION}-linux-${ARCH}"
          sha256sum \
            "sysknife-${VERSION}-linux-${ARCH}" \
            "sysknife-daemon-${VERSION}-linux-${ARCH}" \
            > "sha256sums-linux-${ARCH}.txt"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sysknife-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            sysknife-${{ github.ref_name }}-linux-${{ matrix.arch }}
            sysknife-daemon-${{ github.ref_name }}-linux-${{ matrix.arch }}

      # OpenSSF Scorecard's Signed-Releases check reads the assets attached to a
      # GitHub release, not the attestations page, and recognises provenance by a
      # `.intoto.jsonl` suffix. The attest step writes its signed bundle to a
      # temporary path, so copy it into the workspace under that name; the
      # release job uploads it. `gh attestation verify --bundle` accepts the file
      # as is (docs/release.md).
      - name: Stage provenance bundle as a release asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          test -s "$BUNDLE" || { echo "::error::the provenance step wrote no bundle at '${BUNDLE}'"; exit 1; }
          cp "$BUNDLE" "sysknife-${VERSION}-linux-${ARCH}.intoto.jsonl"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            sysknife-${{ github.ref_name }}-linux-${{ matrix.arch }}
            sysknife-daemon-${{ github.ref_name }}-linux-${{ matrix.arch }}
          sbom-path: sysknife-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            sysknife-*-linux-${{ matrix.arch }}
            sysknife-daemon-*-linux-${{ matrix.arch }}
            sha256sums-linux-${{ matrix.arch }}.txt
            sysknife-*-linux-${{ matrix.arch }}.spdx.json
            sysknife-*-linux-${{ matrix.arch }}.intoto.jsonl
          retention-days: 1

  publish-npm:
    name: Publish sysknife-setup to npm
    needs: [preflight, build, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Smoke-test the package
        run: npm test --prefix packages/setup

      - name: Publish to npm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          if curl --fail --silent --retry 3 --retry-connrefused \
            "https://registry.npmjs.org/sysknife-setup/${VERSION}" >/dev/null; then
            echo "sysknife-setup ${VERSION} already exists; skipping"
          else
            cd packages/setup
            npm publish --access public
          fi

  publish-crates:
    name: Publish to crates.io
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable (branch)
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake

      - name: Publish in dependency order
        # Publish order follows the internal dependency graph:
        #   proto + core -> types -> brain -> daemon -> cli
        # Every generated crate archive is verified before upload. Existing
        # versions are skipped so a partially completed release can be resumed.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          test -n "${CARGO_REGISTRY_TOKEN:-}" || { echo '::error::CARGO_REGISTRY_TOKEN is not configured'; exit 1; }
          source scripts/crates-index-poll.sh
          VERSION="${VERSION#v}"
          for crate in sysknife-proto sysknife-core sysknife-types \
                       sysknife-brain sysknife-daemon sysknife-cli; do
            if crate_version_status "$crate" "$VERSION"; then
              echo "${crate} ${VERSION} already exists; skipping"
            else
              status=$?
              if ((status != 1)); then
                exit "$status"
              fi
              cargo publish -p "$crate" --locked --token "$CARGO_REGISTRY_TOKEN"
              wait_for_crate_version "$crate" "$VERSION"
            fi
          done

  release:
    name: Create GitHub release
    needs: [build, publish-npm, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # gh release create/upload

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          merge-multiple: true
          path: dist/

      - name: List dist contents
        run: ls -lh dist/

      - name: Create GitHub release (metadata only)
        # Split create from upload: a single gh release create with assets
        # that fails partway deletes the release object, which then 404s on
        # subsequent uploads (observed on v0.2.0). Two-phase avoids the race.
        # All env vars are server-controlled (github.ref_name = tag name,
        # github.repository = static repo path) — no user input is shelled.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if release_output="$(gh release view "$VERSION" --repo "$REPO" 2>&1)"; then
            echo "Release $VERSION already exists; skipping creation"
          elif [[ "$release_output" == *'release not found'* ]]; then
            gh release create "$VERSION" \
              --repo "$REPO" \
              --title "$VERSION" \
              --generate-notes
          else
            printf '::error::Failed to check release %s: %s\n' "$VERSION" "$release_output" >&2
            exit 1
          fi

      - name: Upload release assets
        # `dist/sysknife-*-linux-x86_64` matches BOTH `sysknife-v…-x86_64`
        # AND `sysknife-daemon-v…-x86_64` (the latter starts with the same
        # prefix). Listing `sysknife-daemon-*` separately on the same line
        # produces a duplicate file argument that breaks `gh release upload`.
        # Enumerate explicit paths instead — no globs, no duplicates.
        # --clobber allows the workflow to be re-run on the same tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$VERSION" \
            --repo "$REPO" \
            --clobber \
            "dist/sysknife-${VERSION}-linux-x86_64" \
            "dist/sysknife-daemon-${VERSION}-linux-x86_64" \
            "dist/sysknife-${VERSION}-linux-aarch64" \
            "dist/sysknife-daemon-${VERSION}-linux-aarch64" \
            "dist/sha256sums-linux-x86_64.txt" \
            "dist/sha256sums-linux-aarch64.txt" \
            "dist/sysknife-${VERSION}-linux-x86_64.spdx.json" \
            "dist/sysknife-${VERSION}-linux-aarch64.spdx.json" \
            "dist/sysknife-${VERSION}-linux-x86_64.intoto.jsonl" \
            "dist/sysknife-${VERSION}-linux-aarch64.intoto.jsonl"

  publish-registry:
    name: Publish to the MCP Registry
    # After crates.io on purpose: the registry validator fetches the published
    # crate's rendered README to confirm the `mcp-name:` ownership marker, so it
    # cannot succeed before that version exists on crates.io.
    needs: [preflight, publish-crates]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-mcp.yml
    with:
      ref: ${{ github.ref }}

  post-release-checklist:
    name: File the manual post-release steps
    # Only after publication actually succeeded: a checklist for a release that
    # never shipped is worse than no checklist.
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # gh release download
      issues: write  # gh issue create

    steps:
      - name: Fetch the published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$VERSION" --repo "$REPO" \
            --pattern sha256sums-linux-x86_64.txt --dir .

      - name: Open the checklist issue
        # Two directory listings cannot be automated from CI: the MCP Registry
        # requires a device-code login, and Glama's build spec is a browser-only
        # admin form. Left implicit, both get forgotten, and the listings then
        # advertise a version nobody can install. The issue carries the exact
        # commands and the real checksum for this tag.
        #
        # Every interpolated value is server-controlled (the tag we pushed, the
        # static repo path, the actor who pushed it); no user text is shelled.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          binary="sysknife-${VERSION}-linux-x86_64"
          sha="$(awk -v f="$binary" '$2 == f { print $1 }' sha256sums-linux-x86_64.txt)"
          if [ -z "$sha" ]; then
            echo "::error::no checksum for $binary in sha256sums-linux-x86_64.txt"
            exit 1
          fi
          version_no_v="${VERSION#v}"

          cat > body.md <<EOF
          \`${VERSION}\` is published to npm, crates.io, GitHub Releases and the
          official MCP Registry. One directory listing still points at the previous
          version and cannot be updated from CI.

          ### Glama build spec

          Browser-only: <https://glama.ai/mcp/servers/lacs-project/sysknife/admin/dockerfile>

          Replace **Build steps** with the following, leave every other field alone
          (in particular keep the \`mcp-proxy --\` prefix in CMD arguments, which is how
          Glama exposes a stdio server), then click **Build & Release**:

          \`\`\`json
          [
            "curl -fsSL -o /app/sysknife https://github.com/${REPO}/releases/download/${VERSION}/${binary}",
            "echo \\"${sha}  /app/sysknife\\" | sha256sum -c -",
            "chmod +x /app/sysknife"
          ]
          \`\`\`

          ### Notes

          - Checksum above is read from this release's \`sha256sums-linux-x86_64.txt\`, not hand-copied.
          - This does not block users installing \`${VERSION}\`; it affects discovery only.
          - The MCP Registry publish is no longer manual: the \`publish-registry\` job
            authenticates with GitHub Actions OIDC, which is what makes the
            \`io.github.lacs-project/*\` namespace available. A device-code login from a
            laptop only ever gets the personal namespace and is rejected with 403.
          - Close this issue once both are done.
          EOF

          # A failed later job can rerun this step for the same tag. Keep that
          # tag's issue, but close older checklists that point at stale artifacts.
          checklist_prefix="Post-release manual steps for "
          checklist_title="${checklist_prefix}${VERSION}"
          open_checklists="$(gh issue list --repo "$REPO" --state open \
            --search 'in:title "Post-release manual steps for"' \
            --limit 1000 --json number,title \
            --jq '.[] | [.number, .title] | @tsv')"
          current_issue=""
          while IFS=$'\t' read -r number title; do
            [[ -n "$number" ]] || continue
            [[ "$title" == "$checklist_prefix"* ]] || continue
            if [[ "$title" == "$checklist_title" ]]; then
              current_issue="$number"
              continue
            fi
            gh issue close "$number" --repo "$REPO" \
              --comment "Superseded by ${VERSION}."
          done <<< "$open_checklists"

          if [[ -z "$current_issue" ]]; then
            gh issue create --repo "$REPO" \
              --title "$checklist_title" \
              --body-file body.md \
              --assignee "$ACTOR" \
              --label documentation \
              --label maintainer-only
          else
            echo "Checklist for ${VERSION} already exists as #${current_issue}; skipping creation"
          fi
